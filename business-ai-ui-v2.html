<!-- BUSINESS AI UI V2 ENHANCEMENT
Design direction: premium messaging-style dark navy + electric blue.
Add this CSS immediately BEFORE </style> in your current index.html.
Add the JS block immediately BEFORE </script>.
Mascot asset path: /assets/business-ai-mascot.png
-->

<style id="business-ai-v2">
:root{
  --bg:#050914;--panel:#0b1220;--panel2:#101a2b;--border:#1a2940;
  --text:#f7faff;--muted:#8290a5;--green:#37d39a;--yellow:#f1c75b;
  --blue:#3182ff;--blue2:#6eb4ff;--red:#ff6b72;--orange:#ff9f43;
  --radius:20px;--glow:0 0 34px rgba(49,130,255,.12)
}
html,body{background:
  radial-gradient(circle at 50% -20%,rgba(49,130,255,.13),transparent 34rem),
  var(--bg)}
body{letter-spacing:-.01em}
.app{max-width:1180px;padding:22px}
.topbar{
  position:sticky;top:0;z-index:40;margin:0 -8px 24px;padding:10px 8px;
  background:linear-gradient(180deg,rgba(5,9,20,.96),rgba(5,9,20,.72),transparent);
  backdrop-filter:blur(14px)
}
.brand-icon{
  background:linear-gradient(145deg,#1677ff,#65b3ff);color:#fff;
  box-shadow:0 8px 26px rgba(49,130,255,.28);border:1px solid rgba(255,255,255,.15)
}
.status-dot{background:#39e7a7;box-shadow:0 0 16px rgba(57,231,167,.65)}
.page-title h2{font-size:31px;letter-spacing:-1.2px}
.page-title p{font-size:13px}
.card,.stat,.lead-card{
  background:linear-gradient(145deg,rgba(15,25,42,.96),rgba(8,15,27,.96));
  border-color:rgba(126,165,218,.15);box-shadow:0 14px 40px rgba(0,0,0,.15)
}
.card{border-radius:22px}
.stat{position:relative;overflow:hidden;min-height:116px}
.stat:after{
  content:"";position:absolute;inset:auto -32px -48px auto;width:100px;height:100px;
  border-radius:50%;background:rgba(49,130,255,.08);filter:blur(2px)
}
.stat-value{font-size:28px}
.btn,.small-btn,.search,.refresh,.field input,.field select,.field textarea,.sortbar select{
  border-color:rgba(126,165,218,.17);background:#0d1727
}
.btn.primary,.small-btn.primary-action,.save-btn,.chat-form button{
  background:linear-gradient(135deg,#1877ff,#4ca4ff);color:#fff;border:0;
  box-shadow:0 8px 22px rgba(49,130,255,.22)
}
.receptionist{
  border-color:rgba(49,130,255,.28);
  background:
    radial-gradient(circle at 90% 20%,rgba(49,130,255,.16),transparent 30%),
    linear-gradient(145deg,#0d1829,#08111f)
}
.ai-status{color:#69e4b6}
.pipeline{gap:12px}
.stage{background:#0b1524;border-color:rgba(126,165,218,.13)}
.bottom-nav{
  background:rgba(7,13,24,.92);border-color:rgba(126,165,218,.18);
  box-shadow:0 18px 60px rgba(0,0,0,.45)
}
.nav-btn{transition:.18s ease}
.nav-btn.active{
  background:linear-gradient(135deg,rgba(35,118,255,.95),rgba(74,161,255,.95));
  color:#fff;box-shadow:0 6px 18px rgba(49,130,255,.22)
}

/* AI chat */
.chat{
  height:min(660px,calc(100vh - 190px));min-height:480px;padding:0;overflow:hidden;
  border-color:rgba(49,130,255,.22)
}
.ai-chat-header{
  display:flex;align-items:center;gap:12px;padding:15px 16px;
  border-bottom:1px solid rgba(126,165,218,.13);
  background:rgba(11,20,35,.9)
}
.ai-avatar{
  width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(87,164,255,.7);
  box-shadow:0 0 0 4px rgba(49,130,255,.08),0 0 22px rgba(49,130,255,.2);
  background:#0c1728
}
.ai-chat-name{font-size:14px;font-weight:800}
.ai-chat-presence{font-size:11px;color:#68ddb1;margin-top:2px}
.messages{
  padding:18px 14px;background:
    radial-gradient(circle at 20% 10%,rgba(49,130,255,.06),transparent 25rem)
}
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:11px}
.msg-row.user-row{justify-content:flex-end}
.msg-avatar{
  width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;
  border:1px solid rgba(87,164,255,.45);background:#0c1728
}
.msg{
  margin:0;animation:messageIn .22s ease both;
  box-shadow:0 7px 18px rgba(0,0,0,.12)
}
.msg.ai{
  background:#101c2d;border-color:rgba(126,165,218,.15);
  border-bottom-left-radius:5px
}
.msg.user{
  background:linear-gradient(135deg,#1677ff,#429cff);color:#fff;
  border-bottom-right-radius:5px
}
.chat-form{
  padding:12px;background:rgba(8,15,27,.95);border-top:1px solid rgba(126,165,218,.13)
}
.chat-form input{background:#0e1929;border-color:rgba(126,165,218,.18);padding:13px 14px}
.chat-form button{height:44px;width:44px;border-radius:50%}
.thinking-bubble{
  display:flex;align-items:center;gap:4px;min-width:58px;height:38px;
  padding:0 14px;background:#101c2d;border:1px solid rgba(126,165,218,.15);
  border-radius:15px 15px 15px 5px
}
.thinking-bubble i{
  width:6px;height:6px;border-radius:50%;background:#7aa7dd;
  animation:thinkingDot 1.1s infinite ease-in-out
}
.thinking-bubble i:nth-child(2){animation-delay:.15s}
.thinking-bubble i:nth-child(3){animation-delay:.3s}
.thinking .msg-avatar{animation:mascotThink 1.4s infinite ease-in-out}
@keyframes thinkingDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes mascotThink{0%,100%{transform:translateY(0);filter:drop-shadow(0 0 0 rgba(49,130,255,0))}50%{transform:translateY(-3px);filter:drop-shadow(0 0 7px rgba(49,130,255,.7))}}
@keyframes messageIn{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}

.empty{background:#0a1423;border-color:rgba(126,165,218,.13)}
.toast{background:#f7faff;color:#06101d}
@media(min-width:900px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .bottom-nav{width:min(94%,680px)}
}
@media(max-width:560px){
  .app{padding:15px}.page-title h2{font-size:27px}
  .chat{height:calc(100vh - 175px);min-height:440px}
}
</style>

<script id="business-ai-v2-js">
/* Call installBusinessAIV2() once after your existing DOM is available. */
function installBusinessAIV2(){
  const mascot='/assets/business-ai-mascot.png';
  const chat=document.querySelector('.card.chat');
  const messages=document.getElementById('messages');
  if(chat && !chat.querySelector('.ai-chat-header')){
    const header=document.createElement('div');
    header.className='ai-chat-header';
    header.innerHTML=`<img class="ai-avatar" src="${mascot}" alt="Business AI">
      <div><div class="ai-chat-name">Business AI</div>
      <div class="ai-chat-presence">● Online · AI Receptionist</div></div>`;
    chat.prepend(header);
  }
  if(messages) upgradeExistingMessages();
}
function upgradeExistingMessages(){
  const messages=document.getElementById('messages');
  if(!messages)return;
  [...messages.children].forEach(node=>{
    if(!node.classList.contains('msg') || node.parentElement?.classList.contains('msg-row'))return;
    const row=document.createElement('div');
    const isUser=node.classList.contains('user');
    row.className=`msg-row ${isUser?'user-row':'ai-row'}`;
    node.before(row);
    if(!isUser){
      const img=document.createElement('img');
      img.className='msg-avatar';img.src='/assets/business-ai-mascot.png';img.alt='Business AI';
      row.appendChild(img);
    }
    row.appendChild(node);
  });
}
function showAIThinking(){
  hideAIThinking();
  const messages=document.getElementById('messages');if(!messages)return;
  const row=document.createElement('div');row.id='aiThinking';row.className='msg-row ai-row thinking';
  row.innerHTML='<img class="msg-avatar" src="/assets/business-ai-mascot.png" alt="Business AI"><div class="thinking-bubble" aria-label="Business AI is thinking"><i></i><i></i><i></i></div>';
  messages.appendChild(row);messages.scrollTop=messages.scrollHeight;
}
function hideAIThinking(){document.getElementById('aiThinking')?.remove();}

/*
INTEGRATION:
1) At the END of your existing initializeApp(), add:
   installBusinessAIV2();

2) In your existing addEnquiryMessage(), after appendChild(message), add:
   upgradeExistingMessages();

3) In sendEnquiry(), immediately before `try{` add:
   showAIThinking();

4) In sendEnquiry(), as the FIRST line inside `finally{` add:
   hideAIThinking();

5) Also add `hideAIThinking();` immediately before adding the assistant reply,
   so the dots disappear before the response animates in.
*/
</script>
