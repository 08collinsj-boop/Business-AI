const statusClass=(s)=>s==='Confirmed'||s==='Won'?'green':s==='Pending Approval'?'amber':s==='In Progress'?'blue':s==='New'?'':'grey';
const chip=(s)=>`<span class="badge ${statusClass(s)}">${esc(s)}</span>`;
const head=(title,sub,plus)=>`<header class="page-head"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="head-actions">${plus?`<button class="icon-button primary tap" data-open="${plus}" aria-label="Add ${plus}">${svg('plus',22)}</button>`:''}</div></header>`;
const demo=()=>`<span class="demo-badge">Design preview · synthetic data</span>`;
const chartSets={
 'Last 6 months':{labs:['May','Jun','Jul','Aug','Sep','Oct'],nums:[16,24,22,31,27,40],hint:'Illustrative values only — not connected to revenue'},
 'Last 30 days':{labs:['1','6','12','18','24','30'],nums:[12,15,14,21,24,27],hint:'Illustrative values only — not connected to revenue'},
 'Year to date':{labs:['Jan','Mar','May','Jul','Sep','Oct'],nums:[5,10,17,24,30,40],hint:'Illustrative values only — not connected to revenue'},
 'All time':{labs:['2023','2024','2025','2026'],nums:[2,9,21,40],hint:'Illustrative values only — not connected to revenue'}
};
function chart(){const data=chartSets[state.chartRange],n=data.nums.length;const pts=data.nums.map((v,i)=>[12+i*300/(n-1),145-v/45*128]);const path='M '+pts.map(([x,y])=>x.toFixed(1)+' '+y.toFixed(1)).join(' L ');return `<section class="section-card"><div class="chart-head"><h2>Revenue trend</h2><select class="select" aria-label="Chart period" data-chart-range>${Object.keys(chartSets).map(r=>`<option ${r===state.chartRange?'selected':''}>${r}</option>`).join('')}</select></div><div class="chart-wrap"><svg viewBox="0 0 330 160" preserveAspectRatio="none" role="img" aria-label="Illustrative trend data, not actual revenue"><defs><linearGradient id="voltFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#C8FF2E" stop-opacity=".28"/><stop offset="100%" stop-color="#C8FF2E" stop-opacity="0"/></linearGradient></defs>${[20,60,100,145].map(y=>`<path d="M 12 ${y} H 315" stroke="#2A323D" stroke-width=".9"/>`).join('')}<path d="${path} L ${pts.at(-1)[0]} 146 L 12 146 Z" fill="url(#voltFill)"/><path d="${path}" fill="none" stroke="#C8FF2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="4.5" fill="#C8FF2E"/></svg><div class="chart-labels">${data.labs.map(l=>`<span>${esc(l)}</span>`).join('')}</div></div><p class="chart-hint">${data.hint}</p></section>`}
const quick=(k,name,action,first=false)=>`<button class="quick-action tap ${first?'first':''}" data-${action.startsWith('go:')?'go':'open'}="${action.startsWith('go:')?action.slice(3):action}"><span class="quick-icon">${svg(k,22)}</span><span>${name}</span></button>`;
function home(){return `<div class="page-head"><button class="icon-button tap" data-go="more" aria-label="Open more navigation">${svg('more')}</button><div class="head-actions"><button class="icon-button tap" data-toast="Notifications will connect to Colzo data after integration" aria-label="Notifications">${svg('bell')}<span class="unread-dot"></span></button><button class="icon-button tap" data-go="more" aria-label="Account menu"><strong style="font-size:12px">AM</strong></button></div></div>${demo()}<h1 class="greeting">Good morning, Alex.</h1><p class="subheading">Here's what's happening with your business today.</p><div class="stat-grid"><div class="stat-card"><span class="label">Revenue</span><strong>£28,430</strong><span class="change">↗ 12%</span></div><div class="stat-card"><span class="label">Enquiries</span><strong>${enquiries.length}</strong><span class="change neutral">Demo total</span></div><div class="stat-card"><span class="label">Bookings</span><strong>${bookings.length}</strong><span class="change neutral">Demo total</span></div></div>${chart()}<section class="spaced"><div class="heading-line"><h2>Quick actions</h2><button class="text-link" data-go="more">See all ›</button></div><div class="quick-grid">${quick('plus','New enquiry','new-enquiry',true)}${quick('bookings','Add booking','new-booking')}${quick('customers','Customers','go:customers')}${quick('quote','Create quote','go:more')}</div></section><section class="spaced stack"><button class="subtle-card tap" data-toast="This insight is illustrative; live analytics will be wired to Colzo development data"><span class="sparkle">✧</span><span class="grow"><strong>You're on track this month!</strong><p>Sample performance for preview.</p></span><span>›</span></button><button class="subtle-card tap" data-go="more"><span class="grow"><strong>AI receptionist</strong><p>Explore Colzo's AI features</p></span><span style="font-size:12px;color:var(--volt)">Explore ›</span></button></section>`}
function renderEnquiries(){let arr=enquiries.filter(e=>(state.enquiryFilter==='All'||e.status===state.enquiryFilter)&&`${e.name} ${e.subject} ${e.company}`.toLowerCase().includes(state.enquirySearch.toLowerCase()));return `${head('Enquiries','', 'new-enquiry')}<label class="search-box">${svg('search',17)}<input id="enquirySearch" placeholder="Search enquiries..." value="${esc(state.enquirySearch)}" aria-label="Search enquiries"></label><div class="pills" role="group" aria-label="Filter enquiries">${['All','New','In Progress','Quote Sent','Won'].map(f=>`<button class="pill ${f===state.enquiryFilter?'selected':''}" data-enquiry-filter="${f}">${f}${f==='All'?` (${enquiries.length})`:''}</button>`).join('')}</div>${demo()}<div class="list spaced">${arr.map(e=>`<button class="list-item enquiry-item card-button" data-enquiry="${e.id}"><span class="avatar">${esc(e.initial)}</span><span class="row-body"><span class="row-title">${esc(e.name)}</span><span class="row-detail">${esc(e.subject)}</span><span class="row-meta">${chip(e.status)}</span></span><span class="right-col"><span class="small-date">${esc(e.age)}</span><span class="row-end">›</span></span></button>`).join('')||`<div class="empty"><strong>No enquiries found</strong>Try changing the search or selected filter.</div>`}</div>`}
const initials=(name)=>String(name).trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('');
function customerRow(c){return `<button class="list-item card-button" data-customer="${c.id}"><span class="avatar">${esc(initials(c.name))}</span><span class="row-body"><span class="row-title">${esc(c.name)}</span><span class="row-detail">${esc(c.company)}</span><span class="row-meta">${esc(c.activity)}</span></span><span class="row-end">›</span></button>`}
function renderCustomers(){const all=customers.filter(c=>`${c.name} ${c.company} ${c.activity}`.toLowerCase().includes(state.customerSearch.toLowerCase())&&(state.customerFilter==='All'||state.customerFilter==='Recent'&&c.recent||state.customerFilter==='Active'&&c.active||state.customerFilter==='Archived'&&c.archived));const recent=state.customerFilter==='All'&&!state.customerSearch?all.filter(c=>c.recent):[];const rest=all.filter(c=>!recent.includes(c)).sort((a,b)=>a.name.localeCompare(b.name));return `${head('Customers',`${customers.length} total customers`,'new-customer')}<label class="search-box">${svg('search',17)}<input id="customerSearch" placeholder="Search customers by name, business..." value="${esc(state.customerSearch)}" aria-label="Search customers"></label><div class="pills">${['All','Recent','Active','Archived'].map(f=>`<button class="pill ${f===state.customerFilter?'selected':''}" data-customer-filter="${f}">${f}${f==='All'?` (${customers.length})`:''}</button>`).join('')}</div>${demo()}<div class="customer-list">${recent.length?`<div class="section-label"><span>Recently active</span><span>${recent.length} contacts</span></div><div class="list">${recent.map(customerRow).join('')}</div>`:''}${rest.length?`<div class="section-label"><span>Directory</span><span>${rest.length} contacts</span></div><div class="list">${rest.map(customerRow).join('')}</div>`:''}${!all.length?`<div class="empty" style="margin-top:16px"><strong>No customers found</strong>Try a different search or filter.</div>`:''}<aside class="alpha-rail" aria-hidden="true">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<span>${c}</span>`).join('')}</aside></div>`}
function dayChoices(){if(state.bookingView==='Month'){return `<div class="weekdays">${['M','T','W','T','F','S','S'].map(x=>`<div style="text-align:center;color:var(--muted);font-size:10px;padding:6px">${x}</div>`).join('')}${Array.from({length:3},()=>'<div></div>').join('')}${Array.from({length:31},(_,i)=>{const day=i+1;return `<button class="day ${day===state.selectedDay?'active':''}" data-day="${day}" style="min-height:43px"><strong style="font-size:13px">${day}</strong></button>`}).join('')}</div>`}let start=12+state.weekShift*7;return `<div class="weekdays">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>{const n=start+i;return `<button class="day ${n===state.selectedDay?'active':''}" data-day="${n}"><span>${d}</span><strong>${n>=1&&n<=31?n:'—'}</strong><span class="dot">${n===12?'•':'·'}</span></button>`}).join('')}</div>`}
function timeFmt(s){const [h,m]=s.split(':').map(Number);return `${h>12?h-12:h||12}:${String(m).padStart(2,'0')}`}
function scheduleItem(b){const [h]=b.time.split(':').map(Number);return `<div class="appointment"><time><span>${timeFmt(b.time)}</span><small>${h>=12?'PM':'AM'}</small></time><button class="booking-card card-button ${b.status==='Internal'?'internal':''}" data-booking="${b.id}"><h3>${esc(b.title)}</h3><p>${esc(b.person)}${b.company?' · '+esc(b.company):''}</p><span class="meta">${timeFmt(b.time)}–${timeFmt(b.end)} · ${b.minutes}m ${b.status==='Confirmed'||b.status==='Pending Approval'?chip(b.status):''}${b.ai?` <span class="badge">AI Booked</span>`:''}</span></button></div>`}
function renderBookings(){const today=bookings.filter(b=>b.day===state.selectedDay);return `${head('Bookings','Monday, 12 October 2026','new-booking')}<div class="calendar-control" role="group" aria-label="Calendar view">${['Day','Week','Month','Agenda'].map(v=>`<button data-booking-view="${v}" class="${v===state.bookingView?'selected':''}">${v}</button>`).join('')}</div><div class="month-control"><div><button data-week-shift="-1" aria-label="Previous week">‹</button><strong>October 2026</strong><button data-week-shift="1" aria-label="Next week">›</button></div><button class="today-button" data-today>Today</button></div>${state.bookingView==='Agenda'?'':dayChoices()}<div class="schedule-head"><strong>${state.bookingView==='Agenda'?'UPCOMING APPOINTMENTS':"DAY'S SCHEDULE"}</strong><span>${today.length} bookings</span></div>${demo()}<div class="timeline spaced">${(state.bookingView==='Agenda'?bookings:today).map(scheduleItem).join('')||`<div class="empty"><strong>No bookings on this date</strong>Select another date or add a booking.</div>`}</div>`}
function bookingDetail(id){const b=bookings.find(x=>x.id===id);if(!b)return renderBookings();return `<button class="back-button" data-go="bookings">‹ Bookings</button><div class="heading-line"><h1 class="detail-title">Booking Details</h1><button class="icon-button tap" data-toast="More booking actions will be connected after backend integration" aria-label="More booking actions">${svg('more')}</button></div><section class="section-card" style="margin-top:0"><div class="summary-row"><div class="quick-icon" style="color:var(--volt);flex:none">${svg(b.kind==='video'?'video':'clock',24)}</div><div class="grow"><h2>${esc(b.title)}</h2><p>${esc(b.person)}${b.company?' · '+esc(b.company):''}</p></div>${chip(b.status)}</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${b.ai?`<span class="badge">AI Booked</span>`:''}<span class="chip">${b.kind==='video'?'Video call (Microsoft Teams)':'Appointment'}</span></div></section><section class="section-card detail-section"><h3>Customer</h3><div style="display:flex;align-items:center;gap:12px"><span class="avatar">${esc(initials(b.person))}</span><div><strong>${esc(b.person)}</strong><p class="muted" style="font-size:12px;margin:5px 0 0">${esc(b.company||'Internal')}</p></div></div><div class="contact-actions"><button data-toast="Calls will connect to actual customer records">${svg('phone')}Call</button><button data-toast="Messages will connect to actual customer records">${svg('message')}Message</button><button data-go="customers">${svg('profile')}View Profile</button></div></section><section class="section-card detail-section"><h3>Appointment Details</h3>${[['Date & Time',`${b.day} October 2026 · ${timeFmt(b.time)}–${timeFmt(b.end)}`],['Duration',`${b.minutes} minutes`],['Service',b.title],['Location',b.kind==='video'?'Video call (Microsoft Teams)':'To be confirmed'],['Booking Source',b.ai?'AI Receptionist':'Manual'],['Status',b.status]].map(([k,v])=>`<div class="line"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</section>${b.notes?`<section class="section-card detail-section"><h3>Appointment Notes</h3><p class="muted" style="font-size:12px;line-height:1.7">${esc(b.notes)}</p></section>`:''}${b.context?`<section class="section-card detail-section"><h3>AI Booking Context</h3><p class="muted" style="font-size:12px;line-height:1.7">${esc(b.context)}</p></section>`:''}<div class="fixed-action"><button class="action-primary" data-toast="Editing will connect to Colzo booking APIs">Edit Booking</button><button class="action-secondary" data-toast="Rescheduling will connect to Colzo booking APIs">Reschedule</button></div>`}
function customerDetail(id){const c=customers.find(x=>x.id===id);if(!c)return renderCustomers();return `<button class="back-button" data-go="customers">‹ Customers</button><h1 class="detail-title">Customer Profile</h1><section class="section-card" style="margin-top:0"><div class="summary-row"><span class="avatar">${esc(initials(c.name))}</span><div><h2 style="font-size:19px;margin:0 0 4px">${esc(c.name)}</h2><p class="muted" style="font-size:12px;margin:0">${esc(c.company)}</p></div></div><div class="contact-actions"><button data-toast="Demo only: no phone number linked">${svg('phone')}Call</button><button data-toast="Demo only: no message account linked">${svg('message')}Message</button><button data-toast="Demo only: no email address linked">${svg('mail')}Email</button></div></section><section class="section-card detail-section"><h3>Recent activity</h3><p class="muted" style="font-size:13px;line-height:1.6">${esc(c.activity)}</p></section><section class="section-card detail-section"><h3>Related records</h3><p class="muted" style="font-size:12px">Customer enquiries, quotes, projects and AI conversation history will be connected to isolated development data during integration.</p></section>`}
function enquiryDetail(id){const e=enquiries.find(x=>x.id===id);if(!e)return renderEnquiries();return `<button class="back-button" data-go="enquiries">‹ Enquiries</button><h1 class="detail-title">Enquiry Details</h1><section class="section-card" style="margin-top:0"><div class="summary-row"><span class="avatar">${esc(e.initial)}</span><div class="grow"><h2>${esc(e.name)}</h2><p>${esc(e.company)}</p></div>${chip(e.status)}</div></section><section class="section-card detail-section"><h3>Enquiry</h3><div class="line"><span>Subject</span><strong>${esc(e.subject)}</strong></div><div class="line"><span>Received</span><strong>${esc(e.age)}</strong></div><div class="line"><span>Status</span><strong>${esc(e.status)}</strong></div></section><div class="fixed-action"><button class="action-primary" data-toast="Enquiry editing will connect to Colzo APIs">Manage enquiry</button><button class="action-secondary" data-go="customers">View customers</button></div>`}
function more(){return `${head('More','Business tools and settings')}${demo()}<div class="section-label"><span>Business management</span></div><div class="list">${[['spark','AI Receptionist'],['quote','Quotes & estimates'],['customers','Projects'],['enquiries','Marketing'],['bell','Notifications'],['profile','Settings & security']].map(([icon,label])=>`<button class="list-item tap" data-toast="${label} will be implemented in a later design phase"><span class="quick-icon">${svg(icon)}</span><span class="row-body"><span class="row-title">${label}</span></span><span class="row-end">›</span></button>`).join('')}</div><p class="muted" style="font-size:11px;line-height:1.6;margin-top:25px">This preview is entirely offline and uses fictional data. No Business AI accounts, payments, integrations or customer records are connected.</p>`}
const tabs=[['home','Home'],['enquiries','Enquiries'],['bookings','Bookings'],['customers','Customers'],['more','More']];
function nav(){return tabs.map(([id,label])=>`<button class="tab ${id===state.page||(id==='bookings'&&state.page==='booking-detail')||(id==='customers'&&state.page==='customer-detail')||(id==='enquiries'&&state.page==='enquiry-detail')?'active':''}" data-go="${id}" aria-label="${label}" ${id===state.page?`aria-current="page"`:''}>${svg(id)}<span>${label}</span></button>`).join('')+'<div class="home-indicator" aria-hidden="true"></div>'}
function render(keepScroll=false){const sc=$('#screen'),old=sc.scrollTop;let content;switch(state.page){case'home':content=home();break;case'enquiries':content=renderEnquiries();break;case'bookings':content=renderBookings();break;case'customers':content=renderCustomers();break;case'more':content=more();break;case'booking-detail':content=bookingDetail(state.detailId);break;case'customer-detail':content=customerDetail(state.detailId);break;case'enquiry-detail':content=enquiryDetail(state.detailId);break;default:content=home();}sc.innerHTML=content;$('#tabbar').innerHTML=nav();sc.scrollTop=keepScroll?old:0;}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.classList.remove('visible'),3100)}
function modal(kind){let title,fields;if(kind==='new-enquiry'){title='New Enquiry';fields=`<div class="field"><label for="inputName">Customer name</label><input id="inputName" name="name" required maxlength="80" placeholder="Customer name"></div><div class="field"><label for="inputSubject">Enquiry subject</label><input id="inputSubject" name="subject" required maxlength="120" placeholder="What is the enquiry about?"></div>`}else if(kind==='new-customer'){title='Add Customer';fields=`<div class="field"><label for="inputName">Customer name</label><input id="inputName" name="name" required maxlength="80" placeholder="Full name"></div><div class="field"><label for="inputCompany">Business (optional)</label><input id="inputCompany" name="company" maxlength="100" placeholder="Business name"></div>`}else if(kind==='new-booking'){title='New Booking';fields=`<div class="field"><label for="inputName">Customer name</label><input id="inputName" name="name" required maxlength="80" placeholder="Full name"></div><div class="field"><label for="inputSubject">Appointment title</label><input id="inputSubject" name="subject" required maxlength="120" placeholder="Service or appointment"></div><div class="field"><label for="inputDay">Date</label><input id="inputDay" name="day" type="date" required value="2026-10-12"></div><div class="field"><label for="inputTime">Start time</label><input id="inputTime" name="time" type="time" required value="10:00"></div>`}else return;
$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-close-overlay><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-header"><h2>${title}</h2><button type="button" data-close aria-label="Close">×</button></div><p class="muted" style="font-size:12px">Preview only. This will add a temporary example record, not save to any account.</p><form id="modalForm" data-kind="${kind}">${fields}<div class="form-actions"><button class="action-secondary" type="button" data-close>Cancel</button><button class="action-primary" type="submit">Add to preview</button></div></form></div></div>`;$('#inputName')?.focus();}
function closeModal(){$('#modalRoot').innerHTML='';}
function saveForm(form){const d=new FormData(form);const name=String(d.get('name')||'').trim();const subject=String(d.get('subject')||'').trim();const kind=form.dataset.kind;if(!name)return;if(kind==='new-customer'){customers.push({id:Date.now(),name,company:String(d.get('company')||'').trim()||'Independent customer',activity:'New customer · just now',recent:true,active:true});state.page='customers';state.customerSearch='';state.customerFilter='All'}else if(kind==='new-enquiry'&&subject){enquiries.unshift({id:Date.now(),name,subject,company:'',status:'New',age:'just now',initial:initials(name)});state.page='enquiries';state.enquiryFilter='All';state.enquirySearch=''}else if(kind==='new-booking'&&subject){const day=String(d.get('day')||'').split('-');if(day[0]!=='2026'||day[1]!=='10'){toast('This demo calendar currently shows October 2026 only');return}const time=String(d.get('time'));const endH=String((Number(time.slice(0,2))+1)%24).padStart(2,'0');bookings.push({id:Date.now(),day:Number(day[2]),time,end:`${endH}:${time.slice(3)}`,minutes:60,title:subject,person:name,status:'Confirmed',kind:'clock'});bookings.sort((a,b)=>a.time.localeCompare(b.time));state.page='bookings';state.selectedDay=Number(day[2]);state.bookingView='Week'}else return;closeModal();render();toast('Added to this preview only — nothing saved remotely');}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-close-overlay]');if(!t)return;
 if(t.hasAttribute('data-close')||(t.hasAttribute('data-close-overlay')&&e.target===t)){closeModal();return}
 if(t.hasAttribute('data-open')){modal(t.dataset.open);return}
 if(t.hasAttribute('data-go')){state.page=t.dataset.go;state.detailId=null;render();return}
 if(t.hasAttribute('data-enquiry-filter')){state.enquiryFilter=t.dataset.enquiryFilter;render(true);return}
 if(t.hasAttribute('data-customer-filter')){state.customerFilter=t.dataset.customerFilter;render(true);return}
 if(t.hasAttribute('data-enquiry')){state.detailId=Number(t.dataset.enquiry);state.page='enquiry-detail';render();return}
 if(t.hasAttribute('data-customer')){state.detailId=Number(t.dataset.customer);state.page='customer-detail';render();return}
 if(t.hasAttribute('data-booking')){state.detailId=Number(t.dataset.booking);state.page='booking-detail';render();return}
 if(t.hasAttribute('data-booking-view')){state.bookingView=t.dataset.bookingView;render(true);return}
 if(t.hasAttribute('data-day')){state.selectedDay=Number(t.dataset.day);render(true);return}
 if(t.hasAttribute('data-week-shift')){state.weekShift+=Number(t.dataset.weekShift);render(true);return}
 if(t.hasAttribute('data-today')){state.selectedDay=12;state.weekShift=0;render(true);return}
 if(t.hasAttribute('data-toast')){toast(t.dataset.toast);return}
});
document.addEventListener('input',e=>{if(e.target.id==='enquirySearch'||e.target.id==='customerSearch'){const id=e.target.id;const pos=e.target.selectionStart;state[id==='enquirySearch'?'enquirySearch':'customerSearch']=e.target.value;render(true);const newInput=$('#'+id);if(newInput){newInput.focus();newInput.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-chart-range]')){state.chartRange=e.target.value;render(true)}});
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();

</script>
</body>
</html>
