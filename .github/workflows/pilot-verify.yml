name: Pilot Verification

on:
  workflow_dispatch:
  push:
    branches:
      - pilot-ready-20260923

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Pilot
        run: npm run verify
