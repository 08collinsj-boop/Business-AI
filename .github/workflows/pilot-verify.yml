name: Pilot Verification

on:
  workflow_dispatch:
  push:
    branches:
      - pilot-ready-20260923

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated PostgreSQL 17 test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/colzo-native-test" --ignore-scripts --no-audit --no-fund @embedded-postgres/linux-x64@17.6.0-beta.15 pg@8.16.3
          native_lib="$RUNNER_TEMP/colzo-native-test/node_modules/@embedded-postgres/linux-x64/native/lib"
          for library in libicudata libicui18n libicuuc; do
            ln -s "$library.so.60.2" "$native_lib/$library.so.60"
          done

      - name: Verify isolated native booking concurrency
        run: |
          export COLZO_PG_BIN="$RUNNER_TEMP/colzo-native-test/node_modules/@embedded-postgres/linux-x64/native/bin"
          export COLZO_PG_CLIENT_MODULE="$RUNNER_TEMP/colzo-native-test/node_modules/pg/lib/index.js"
          export LD_LIBRARY_PATH="$COLZO_PG_BIN/../lib"
          node scripts/verify-colzo-booking-overlap-native.mjs

      - name: Verify isolated native signup capacity and replay SQL
        run: |
          export COLZO_PG_BIN="$RUNNER_TEMP/colzo-native-test/node_modules/@embedded-postgres/linux-x64/native/bin"
          export COLZO_PG_CLIENT_MODULE="$RUNNER_TEMP/colzo-native-test/node_modules/pg/lib/index.js"
          export LD_LIBRARY_PATH="$COLZO_PG_BIN/../lib"
          node scripts/verify-colzo-self-service-native.mjs

      - name: Install signed PostgreSQL 17 backup clients for disposable restore drill
        run: |
          # Embedded Postgres supplies initdb/server, not pg_dump/pg_restore.
          # Use the PostgreSQL Global Development Group's signed Noble APT repository.
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          # APT uses the explicit Signed-By file from the official HTTPS source.
          # Keep the installer compatible with supported Ubuntu runner images.
          . /etc/os-release
          case "$VERSION_CODENAME" in
            noble|resolute) ;;
            *) echo 'Unsupported CI Ubuntu release for the PGDG test client.' >&2; exit 1 ;;
          esac
          test "$(dpkg --print-architecture)" = amd64
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: amd64\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/colzo-pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'

      - name: Verify isolated ClickUp SQL and synthetic backup restore
        run: |
          export COLZO_PG_BIN="$RUNNER_TEMP/colzo-native-test/node_modules/@embedded-postgres/linux-x64/native/bin"
          export COLZO_PG_CLIENT_MODULE="$RUNNER_TEMP/colzo-native-test/node_modules/pg/lib/index.js"
          export COLZO_PG_BACKUP_CLIENT_BIN="/usr/lib/postgresql/17/bin"
          export LD_LIBRARY_PATH="$COLZO_PG_BIN/../lib"
          node scripts/verify-colzo-clickup-sql-native.mjs

      - name: Verify Pilot
        run: npm run verify
