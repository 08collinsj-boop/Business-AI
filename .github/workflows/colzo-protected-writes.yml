name: Colzo protected writes

on:
  pull_request:
    branches:
      - feature/colzo-screen-integration-20261014
  push:
    branches:
      - fix/colzo-composio-first-protected-writes-20261015

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full verification suite
        run: npm run verify
